[plugin]
name = mqtt
description = Publishes status and events to an MQTT broker
version = 1.0.0
exec = /usr/lib/qmi-supervisor/plugins/mqtt/plugin.py
args =
enabled = false
capabilities = read:status, read:events

[settings]
host = 127.0.0.1
port = 1883
prefix = qmi-supervisor
interval = 30
username =
password =
tls = false
